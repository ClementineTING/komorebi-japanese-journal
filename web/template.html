// User dictionaries are kept separately from the bundled JMdict data.
let pendingImport=null,customSession=null;
function customKey(w){return w.w.normalize('NFKC').trim()+'\u0000'+w.r.normalize('NFKC').trim()}
function parseCSV(source){
 const text=source.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false,closed=false,line=1,start=1;
 const push=()=>{row.push(cell);cell='';closed=false};
 for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else{quoted=false;closed=true}}else{cell+=c;if(c==='\n')line++}continue}
 if(c==='"'){if(cell||closed)throw Error(`第 ${line} 行：引号位置不正确`);quoted=true}
 else if(c===','){push()}
 else if(c==='\r'||c==='\n'){if(c==='\r'&&text[i+1]==='\n')i++;push();if(row.some(v=>v.trim()))rows.push({cells:row,line:start});row=[];line++;start=line}
 else{if(closed)throw Error(`第 ${line} 行：结束引号后只能是逗号或换行`);cell+=c}
 }
 if(quoted)throw Error(`第 ${start} 行：双引号未闭合`);push();if(row.some(v=>v.trim()))rows.push({cells:row,line:start});return rows;
}
const csvFields=['单词','假名','释义','词性','例句','例句翻译','等级'];
function validateCSV(text){const rows=parseCSV(text);if(rows.length<2)throw Error('请包含表头和至少一行单词。');let header=rows.shift().cells.map(s=>s.trim());if(new Set(header).size!==header.length)throw Error('表头有重复列。');if(header.some(h=>!csvFields.includes(h)))throw Error('表头仅支持：'+csvFields.join('、'));for(const h of csvFields.slice(0,3))if(!header.includes(h))throw Error('缺少必填列：'+h);if(rows.length>5000)throw Error('每次最多导入 5,000 行。');return rows.map(row=>{if(row.cells.length!==header.length)throw Error(`第 ${row.line} 行：列数与表头不一致`);let obj=Object.fromEntries(header.map((h,i)=>[h,row.cells[i].trim()]));for(const h of csvFields.slice(0,3))if(!obj[h])throw Error(`第 ${row.line} 行：${h}不能为空`);if(obj['等级']&&!/^[Nn][1-5]$/.test(obj['等级']))throw Error(`第 ${row.line} 行：等级只能为 N5、N4、N3、N2、N1 或留空`);if(row.cells.some(v=>v.length>4000))throw Error(`第 ${row.line} 行：单个字段最多 4,000 字符`);return {level:(obj['等级']||'').toUpperCase(),w:obj['单词'],r:obj['假名'],zh:obj['释义'],pos:obj['词性']||'自定义',ex:obj['例句']||'',cn:obj['例句翻译']||'',en:'',aliases:obj['单词']+' '+obj['假名'],custom:true}})}
function importWords(words){const keys=new Set(state.custom.map(customKey)),added=[];for(const w of words){const key=customKey(w);if(keys.has(key))continue;keys.add(key);added.push({...w,id:'user-'+crypto.randomUUID()})}if(!added.length)return {added:0,skipped:words.length};if(state.custom.length+added.length>10000)throw Error('自定义词库最多保存 10,000 词。');const next={...state,custom:[...state.custom,...added]};try{localStorage.setItem('komorebi-v1',JSON.stringify(next))}catch{throw Error('本地存储空间不足或保存被禁用，本次没有写入。请减少导入数量。')}state=next;for(const w of added){DATA.push(w);byId.set(w.id,w)}return {added:added.length,skipped:words.length-added.length}}
function downloadText(name,text,type){if(window.chrome?.webview){window.chrome.webview.postMessage({kind:"saveFile",name,text});return;}if(window.webkit?.messageHandlers?.saveFile){window.webkit.messageHandlers.saveFile.postMessage({name,text});return;}const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderImport(){pendingImport=null;$('#view').innerHTML=`<div class="panel settings import-panel"><div class="import-heading"><div><h3>自己的词，也有一席之地。</h3><p class="muted">已保存 ${state.custom.length} 个自定义词 · 仅保存在这台设备</p></div><button id="custom-study" class="primary">学习我的词库 →</button></div><h3>CSV 批量导入</h3><p>使用 Excel 或其他表格工具编辑，然后另存为 <b>CSV UTF-8（逗号分隔）</b>。首行是列名，顺序可以调整。等级可填 N5–N1；留空时按参考词表识别，未匹配显示“未分级”。</p><div class="table-wrap"><table><thead><tr>${csvFields.map((h,i)=>`<th>${h}${i<3?' <small>必填</small>':' <small>选填</small>'}</th>`).join('')}</tr></thead><tbody><tr><td>桜</td><td>さくら</td><td>樱花</td><td>名词</td><td>桜が咲いています。</td><td>樱花正在盛开。</td><td>留空自动识别</td></tr></tbody></table></div><p class="muted">每次最多 5,000 行、2 MB，累计最多 10,000 词。含逗号、换行的单元格需用双引号包裹（表格软件会自动处理）。<br>按“单词 + 假名”跳过已有自定义词和文件内重复行；内置词典保持不变。有格式错误时整批不写入。</p><div class="import-buttons"><button id="template" class="outline">下载 CSV 模板</button><label class="upload-label">选择 CSV 文件<input id="csv-file" type="file" accept=".csv,text/csv"></label><button id="custom-export" class="outline">导出我的词库</button></div><div id="import-result" role="status" aria-live="polite"></div><hr><h3>手动添加一个单词</h3><form id="manual-form"><div class="manual-grid">${csvFields.map((h,i)=>`<label>${h}${i<3?' *':''}<input name="f${i}" ${i<3?'required':''} maxlength="4000" placeholder="${['例：桜','例：さくら','例：樱花','例：名词','例：桜が咲いています。','例：樱花正在盛开。','自动识别或留空'][i]}"></label>`).join('')}</div><button class="primary" type="submit">添加并保存</button><span id="manual-result" role="status" style="margin-left:15px"></span></form></div>`;
 $('#template').onclick=()=>downloadText('木漏れ日-词库模板.csv','\uFEFF'+csvFields.join(',')+'\r\n桜,さくら,樱花,名词,桜が咲いています。,樱花正在盛开。,\r\n','text/csv;charset=utf-8');
 $('#custom-export').onclick=()=>{if(!state.custom.length){toast('还没有自定义单词。');return}const cell=v=>'"'+String(v||'').replace(/"/g,'""')+'"';downloadText('木漏れ日-我的词库.csv','\uFEFF'+csvFields.join(',')+'\r\n'+state.custom.map(w=>[w.w,w.r,w.zh,w.pos,w.ex,w.cn,w.level||''].map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')};
 $('#custom-study').onclick=()=>{if(!state.custom.length){toast('先添加或导入一些单词吧。');return}customSession=state.custom.map(w=>w.id);tab='study';detail=null;index=0;revealed=!state.hide;render()};
 $('#csv-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;pendingImport=null;const result=$('#import-result');result.textContent='正在检查文件…';try{if(file.size>2*1024*1024)throw Error('文件超过 2 MB，请拆分后再导入。');const text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());const words=validateCSV(text);if(!result.isConnected)return;pendingImport=words;const known=new Set(state.custom.map(customKey));let fresh=0;for(const w of words){const key=customKey(w);if(!known.has(key)){fresh++;known.add(key)}}result.innerHTML=`<div class="import-preview"><b>${esc(file.name)}</b><p>格式检查通过 · ${fresh} 个新词 · ${words.length-fresh} 行重复将跳过</p>${words.slice(0,3).map(w=>`<p>${esc(w.w)} · ${esc(w.r)} · ${esc(w.zh)}</p>`).join('')}<button id="confirm-import" class="primary" ${fresh?'':'disabled'}>导入并保存 ${fresh} 个单词</button></div>`;$('#confirm-import').onclick=()=>{try{const r=importWords(pendingImport);renderImport();$('#import-result').textContent=`已保存 ${r.added} 个新词，跳过 ${r.skipped} 行重复。可在词汇手册选择“我的词库”。`}catch(err){result.textContent=err.message}}}catch(err){if(result.isConnected)result.textContent=err instanceof TypeError?'文件不是有效 UTF-8，请另存为 CSV UTF-8 后重试。':err.message}};
 $('#manual-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),values=csvFields.map((_,i)=>String(f.get('f'+i)||'').trim());try{const words=validateCSV(csvFields.join(',')+'\n'+values.map(v=>'"'+v.replace(/"/g,'""')+'"').join(','));const r=importWords(words);if(!r.added){$('#manual-result').textContent='此单词和假名已存在，未重复添加。';return}renderImport();$('#manual-result').textContent='已保存，可在我的词库中学习。'}catch(err){$('#manual-result').textContent=err.message}};
}

const toHira=s=>String(s||'').normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96));
const norm=s=>toHira(s).toLowerCase().replace(/[\u200B-\u200D\uFEFF]/g,'').trim();

const levelIndex=new Map();for(const d of LEVEL_DATA){const k=norm(d[0]);if(!levelIndex.has(k))levelIndex.set(k,[]);levelIndex.get(k).push({r:norm(d[1]),level:d[2]})}
function difficulty(w){if(w.autoLevel&&!w.level)return w.autoLevel;if(LEVELS.includes(w.level))return w.level;const candidates=[];for(const a of [w.w,...(w.aliases||'').split(' ')])for(const d of levelIndex.get(norm(a))||[])if(!d.r||d.r===norm(w.r))candidates.push(d.level);return LEVELS.find(l=>candidates.includes(l))||'ungraded'}
function badge(w){const l=difficulty(w);return `<span class="level-badge ${l}" title="${w.level?'用户指定等级':'JLPT 第三方参考分级，非官方考纲'}">${l==='ungraded'?'未分级':l}${w.level?' · 自设':''}</span>`}

function levelMatches(w,l){return l==='all'||difficulty(w)===l}
for(const w of DATA){w.searchKey=norm([w.w,w.r,w.aliases,w.zh,w.en].join(' '));w.autoLevel=difficulty(w)}
function sourceWords(source){if(source==='all')return DATA;if(source==='custom')return state.custom;if(source==='favorites')return state.favorites.map(id=>byId.get(id)).filter(Boolean);return DECK.map(id=>byId.get(id))}

function studyToolbar(){return `<div class="study-toolbar"><label>学习词书 <select id="study-source"><option value="curated" ${studySource==='curated'?'selected':''}>入门精选 · 20 词</option><option value="all" ${studySource==='all'?'selected':''}>全部词汇</option><option value="custom" ${studySource==='custom'?'selected':''}>我的词库</option><option value="favorites" ${studySource==='favorites'?'selected':''}>我的收藏</option></select></label><label>难度 <select id="study-level">${levelOptions(studyLevel)}</select></label><span class="muted" role="status">${studyLevel==='all'?'当前词书':studyLevel==='ungraded'?'未分级':studyLevel} · 共 ${activeDeck().length.toLocaleString()} 词</span></div>`}

 $('#view').innerHTML=`<form class="list-tools" id="search-form"><input id="search" aria-label="搜索词汇" autocomplete="off" placeholder="日语、假名、中文或英文；支持回车搜索" value="${esc(query)}"><button class="primary search-button" type="submit">搜索</button><select id="filter" aria-label="筛选词库"><option value="all">全部词汇</option><option value="curated" ${filter==='curated'?'selected':''}>双语入门</option><option value="custom" ${filter==='custom'?'selected':''}>我的词库</option></select><select id="list-level" aria-label="筛选难度">${levelOptions(listLevel)}</select><output id="level-count" aria-live="polite" style="display:flex;align-items:center;font-size:12px;color:var(--green);white-space:nowrap"></output></form><div class="list-hint">支持平假名 / 片假名、全角 / 半角匹配 · N5 → N1 为第三方参考等级</div><div class="panel" id="list-results"></div>`;
 let composing=false;

 $('#filter').onchange=e=>{filter=e.target.value;page=0;renderListResults()};$('#list-level').onchange=e=>{listLevel=e.target.value;page=0;renderListResults()};renderListResults();

function renderListResults(){const q=norm(query);let arr=DATA.filter(w=>(tab!=='favorites'||state.favorites.includes(w.id))&&(filter!=='curated'||(w.zh&&!w.custom))&&(filter!=='custom'||w.custom)&&levelMatches(w,listLevel));const levelTotal=arr.length;arr=arr.filter(w=>(!q||(w.searchKey||norm([w.w,w.r,w.aliases,w.zh,w.en].join(' '))).includes(q)));
 $('#level-count').textContent=(listLevel==='all'?'当前词库':listLevel==='ungraded'?'未分级':listLevel)+' · 共 '+levelTotal.toLocaleString()+' 词'+(q?' · 搜索匹配 '+arr.length.toLocaleString()+' 词':'');
 if(q)arr.sort((a,b)=>Number(norm(b.w)===q||norm(b.r)===q)-Number(norm(a.w)===q||norm(a.r)===q));page=Math.min(page,Math.max(0,Math.ceil(arr.length/30)-1));
 $('#list-results').innerHTML=`${arr.length?arr.slice(page*30,page*30+30).map(w=>`<button class="row" data-id="${w.id}"><strong lang="ja">${rubyWord(w.w,w.r)}</strong><span>${esc(w.r)}</span><em>${esc(w.zh||w.en)}</em>${badge(w)}</button>`).join(''):`<div class="empty">${q?'没有找到匹配词汇。可尝试清除难度筛选或使用其他写法。':tab==='favorites'?'暂无符合条件的收藏词。':'暂无符合条件的词汇。'}</div>`}<div class="pagination"><button id="prev" ${page===0?'disabled':''}>← 上一页</button><span class="muted">${arr.length.toLocaleString()} 词 · ${page+1} / ${Math.max(1,Math.ceil(arr.length/30))}</span><button id="next" ${(page+1)*30>=arr.length?'disabled':''}>下一页 →</button></div>`;
 $('#prev').onclick=()=>{page--;renderListResults()};$('#next').onclick=()=>{page++;renderListResults();window.scrollTo(0,0)};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{detail=b.dataset.id;revealed=true;render()});
}
const kanji=/[\u3400-\u9fff々〆ヵヶ]/;
function rubyWord(text,reading){if(!kanji.test(text)||!reading)return esc(text);return `<ruby>${esc(text)}<rt>${esc(toHira(reading))}</rt></ruby>`}
const rubyCache=new Map(),rubyPending=new Map();let rubyWorker,rubyReady=false,rubySeq=0,rubyFailed=false;
function initRuby(){try{const blob=new Blob([document.getElementById('furigana-worker').textContent],{type:'text/javascript'});const url=URL.createObjectURL(blob);rubyWorker=new Worker(url);URL.revokeObjectURL(url);rubyWorker.onmessage=e=>{const m=e.data;if(m.type==='ready'){rubyReady=true;annotateVisible()}else if(m.type==='result'){const job=rubyPending.get(m.id);if(!job)return;rubyPending.delete(m.id);const html=m.tokens.map(t=>rubyWord(t.text,t.reading)).join('');rubyCache.set(job.text,html);if(rubyCache.size>300)rubyCache.delete(rubyCache.keys().next().value);annotateVisible()}else{rubyFailed=true;annotateVisible()}};rubyWorker.onerror=()=>{rubyFailed=true;annotateVisible()};rubyWorker.postMessage({type:'init',dicts:JSON.parse(document.getElementById('furigana-dicts').textContent)});document.getElementById('furigana-dicts').remove()}

function annotateVisible(){document.querySelectorAll('[data-furigana]').forEach(el=>{const text=el.dataset.furigana;if(!kanji.test(text))return;if(rubyCache.has(text)){el.innerHTML=rubyCache.get(text);el.removeAttribute('aria-busy');return}if(rubyFailed){el.textContent=text;el.title='自动注音暂不可用，请重新打开页面。';return}el.setAttribute('aria-busy','true');el.title='离线自动注音；多音词与专名请结合语境核对。';if(rubyReady&&![...rubyPending.values()].some(x=>x.text===text)){const id=++rubySeq;rubyPending.set(id,{text});rubyWorker.postMessage({type:'annotate',id,text})}})}
